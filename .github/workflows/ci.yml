name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running CI run for the same branch/PR when a new push
# supersedes it — avoids burning Actions minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Matches `supabase start`'s fixed local dev values exactly — see
      # docs/residency.md. Real secrets come from Vercel/Supabase platform
      # env in every real deployment; nothing here is a live secret.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      NATIONAL_ID_HASH_KEY: ci-placeholder-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Real gate as of Phase 11: the 3 high-severity advisories flagged in
      # Phase 10 (postcss, sharp) are cleared by the `next` 16.3.0 bump.
      # drizzle-kit's moderate esbuild advisory stays unaddressed on purpose
      # — it's a dev-only tool (db:generate/db:studio) never shipped to
      # users, and the fix is a breaking drizzle-kit downgrade; not worth
      # forcing at --audit-level=high.
      - name: Audit dependencies (fails on high/critical advisories)
        run: npm audit --audit-level=high

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # certification-gate.test.ts renders real certificate PDFs via headless
      # Chromium (src/modules/platform/pdf/service.ts) — the binary isn't
      # bundled with the playwright npm package, only fetched on demand.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Real local Supabase stack (Postgres + Auth + Storage + PostgREST),
      # not a bare postgres image — our migrations reference auth.users and
      # auth.jwt()/auth.uid(), which only the Supabase stack provides. This
      # also means CI applies migrations the exact same way local dev does.
      - name: Start local Supabase stack
        run: supabase start --exclude imgproxy,pgbouncer

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: RLS check (fails if any public table lacks Row Level Security)
        run: npm run rls-check

      - name: Test (unit + DB-backed integration/RLS suites)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Forbidden pattern check — no service_role in client bundle
        run: npm run check:no-service-role
