name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running CI run for the same branch/PR when a new push
# supersedes it — avoids burning Actions minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Matches `supabase start`'s fixed local dev values exactly — see
      # docs/residency.md. Real secrets come from Vercel/Supabase platform
      # env in every real deployment; nothing here is a live secret.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      NATIONAL_ID_HASH_KEY: ci-placeholder-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Real gate as of Phase 11: the 3 high-severity advisories flagged in
      # Phase 10 (postcss, sharp) are cleared by the `next` 16.3.0 bump.
      # The tree is clean as of this commit — 0 advisories at any severity.
      #
      # Two things got it there, neither of them `npm audit fix --force`:
      # nanoid 3.3.16 (GHSA-2v37-7h3g-55p8, via postcss) bumped to 3.3.18 by
      # a plain `npm audit fix`; and the esbuild dev-server advisory
      # (GHSA-67mh-4wv8-2f99), which npm wanted to "fix" by DOWNGRADING
      # drizzle-kit 0.31.10 -> 0.18.1, resolved instead with an `esbuild`
      # override in package.json. drizzle-kit's own esbuild was already
      # patched; only the nested @esbuild-kit/core-utils pinned a vulnerable
      # ~0.18. Never run `npm audit fix --force` here — for this repo it
      # points backwards.
      - name: Audit dependencies (fails on high/critical advisories)
        run: npm audit --audit-level=high

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # certification-gate.test.ts renders real certificate PDFs via headless
      # Chromium (src/modules/platform/pdf/service.ts) — the binary isn't
      # bundled with the playwright npm package, only fetched on demand.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Real local Supabase stack (Postgres + Auth + Storage + PostgREST),
      # not a bare postgres image — our migrations reference auth.users and
      # auth.jwt()/auth.uid(), which only the Supabase stack provides. This
      # also means CI applies migrations the exact same way local dev does.
      - name: Start local Supabase stack
        run: supabase start --exclude imgproxy,pgbouncer

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: RLS check (fails if any public table lacks Row Level Security)
        run: npm run rls-check

      # The stack starts empty, but the integration suites need the real
      # catalog: every course is gated on the OHS General Induction, so
      # tests/helpers/ohs-induction.ts looks CSCC00 up by code and fails
      # loudly without it. Seeding here also means CI exercises the same
      # seeder deploy-migrations.yml runs against dev/staging/prod, so a
      # broken seed script fails a PR instead of a deploy.
      - name: Seed catalog data
        run: npm run seed:catalog
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Seed trainer roster
        run: npm run seed:trainers
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test (unit + DB-backed integration/RLS suites)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Forbidden pattern check — no service_role in client bundle
        run: npm run check:no-service-role
