name: Deploy migrations

# Manually triggered, not branch-triggered — this repo works on a single
# main branch (see docs/residency.md), so "which environment gets this
# commit's migrations" is a decision made by whoever runs this, not by
# which branch they pushed to.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Supabase project
        required: true
        type: choice
        options: [dev, staging, prod]

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link ${{ inputs.environment }} project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations
        run: supabase db push --yes

      # Idempotent (onConflictDoNothing() throughout) — safe to re-run every
      # deploy, so catalog/prerequisite/pricing edits to scripts/seed-catalog.mjs
      # ship the same way schema changes do, without a separate manual step.
      # Uses tsx, not plain node: the script imports src/db/schema/*.ts by
      # extensionless relative path, which Node's own ESM loader can't
      # resolve on its own.
      - name: Seed catalog data
        run: npx tsx scripts/seed-catalog.mjs
        env:
          DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres

      # Same deal as the catalog: idempotent, matched on email, and records
      # only — no auth accounts are provisioned for these 13 people here.
      #
      # Deployed environments use the trainers' real addresses, so a trainer
      # signs in with the same email everywhere and password recovery works
      # for them. That is a deliberate trade: personal addresses then exist
      # in dev and staging too, so if a Supabase email feature is ever
      # enabled on one of those projects (recovery, magic links, email-change
      # confirmation), real people can receive mail from a test system.
      # Check that before switching any of them on.
      #
      # The seeder itself defaults to placeholders, so an environment that
      # forgets to pass this gets trainers.example.com rather than leaking
      # real addresses by omission. Setting it back to 'placeholder' rewrites
      # them in place — but only for trainers who have no login yet, since
      # the address of one who does is what their auth account was created
      # with.
      - name: Seed trainer roster
        run: npx tsx scripts/seed-trainers.mjs
        env:
          DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
          TRAINER_EMAIL_MODE: real

      # Confirms the deployed schema didn't lose RLS coverage along the way
      # — same check CI runs locally, now against the real project.
      - name: RLS check against the deployed project
        run: npm run rls-check
        env:
          DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
